# Compose Specification（不再声明 version，新版 docker compose 已废弃该字段）
services:
  mysql:
    image: docker.1ms.run/mysql:8.0
    container_name: e-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_platform
      # 时区修复（BUG-3）：容器 OS 时区设为 Asia/Shanghai，
      # 使 @@global.time_zone=SYSTEM 时 NOW()/CURRENT_TIMESTAMP 落在中国时区，
      # 与应用 JVM 的 CST(+0800) 写入刻度对齐。
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    # --default-time-zone=+8:00 是直接、权威的修复：无论容器 OS 是否带 tzdata，
    # 都强制 MySQL 服务端的 time_zone 为东八区，NOW()/DEFAULT CURRENT_TIMESTAMP 一律 +8:00。
    # 与 TZ 环境变量双保险，二者一致。
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4' --skip-character-set-client-handshake --default-time-zone=+8:00
    healthcheck:
      # 供 start.sh 轮询等待就绪，避免固定 sleep
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      e-platform-network:
        ipv4_address: 192.168.10.10

  redis:
    # 官方 redis 镜像（原 bitnami/redis 已切换）
    image: docker.1ms.run/redis:7
    container_name: e-platform-redis
    # 官方镜像不认识 bitnami 专有的 ALLOW_EMPTY_PASSWORD，已删除该环境变量。
    # 默认即为无密码模式，开启 AOF 持久化。
    # TZ 仅影响 redis 进程自身的日志时间戳，不改变任何存储值（redis 不按 timezone 存时间），
    # 这里加上仅为与 mysql 的日志时区保持一致，方便排查，无功能影响。
    environment:
      TZ: Asia/Shanghai
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      e-platform-network:
        ipv4_address: 192.168.10.11

  rabbitmq:
    image: docker.1ms.run/library/rabbitmq:latest
    container_name: e-platform-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # 同 redis：仅日志时间戳一致，无数据存储层面的 timezone 概念。
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      e-platform-network:
        ipv4_address: 192.168.10.12

networks:
  e-platform-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/25
          gateway: 192.168.10.1

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
