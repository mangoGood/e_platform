name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 后端微服务构建
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: |
          cd backend
          mvn clean package -DskipTests -B -q
        env:
          JWT_SECRET: ci-test-jwt-secret-key-at-least-64-characters-long-for-validation

  # Web 前端构建
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

  # Android 多模块构建
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android apps
        run: |
          cd android
          ./gradlew :shared-core:assembleDebug :buyer-app:assembleDebug :seller-app:assembleDebug --no-daemon
