server:
  port: 8086

spring:
  application:
    name: e-platform-product
  # Nacos 服务注册发现（默认禁用，设置 NACOS_ENABLED=true 启用）
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/e_platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.ecommerce: info

# 内部服务调用令牌
# 【安全】不设默认值：写死 ePlatformInternalSecret2026 这类兜底口令等于把内部接口的钥匙
# 提交进公开仓库。未配置时为空串，ProductController 会拒绝一切内部调用，
# FeignConfig 也不会往出站请求上挂该头 —— 宁可显式失败，也不用人尽皆知的默认密码。
internal:
  token: ${INTERNAL_TOKEN:}

# product -> 其他服务的直连地址（Feign，不经网关）
service:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8087}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8085}

# Feign 超时：购买校验挂在评价写入的主链路上，必须快速失败而不是拖死请求
feign:
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 3000

# 网关 -> 内部服务 HMAC-SHA256 签名校验
# secret 来源于环境变量 GATEWAY_SIGN_SECRET（start.sh 自动随机生成写入 .env）
# 此处给空默认值仅为保证服务在裸启动时不因占位符解析失败；
# 真实的「启用但密钥为空」校验由 GatewaySignProperties 在 T02 中 fail-fast 处理
gateway:
  sign:
    enabled: ${GATEWAY_SIGN_ENABLED:true}
    secret: ${GATEWAY_SIGN_SECRET:}
    tolerance-ms: ${GATEWAY_SIGN_TOLERANCE_MS:300000}

# 健康检查端点，供 start.sh 轮询判定服务就绪
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
